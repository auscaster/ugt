services:
  task:
    image: ${UGT_IMAGE}
    build:
      context: ./recipe
    platform: linux/${UGT_ARCH}
    network_mode: none
    working_dir: /work
    mem_limit: 3g
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs
      - ./recipe/check:/work/check:ro
    environment: &edit_settings
      MARGIN_SECONDS: ${MARGIN_SECONDS:-0.1}
      AUDIO_THRESHOLD: ${AUDIO_THRESHOLD:-0.04}
    entrypoint: ["python", "check/edit.py"]

  check:
    environment: *edit_settings
    image: ${UGT_IMAGE}
    platform: linux/${UGT_ARCH}
    profiles: [check]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs:ro
      - ./recipe/check:/work/check:ro
    entrypoint: ["python","check/check.py"]

  sample:
    image: ${UGT_IMAGE}
    platform: linux/${UGT_ARCH}
    profiles: [sample]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs
      - ./recipe/check:/work/check:ro
    entrypoint: ["python","check/sample.py"]

  sample-check:
    environment: *edit_settings
    image: ${UGT_IMAGE}
    platform: linux/${UGT_ARCH}
    profiles: [sample]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs:ro
      - ./recipe/check:/work/check:ro
    entrypoint: ["python","check/check.py","sample"]
