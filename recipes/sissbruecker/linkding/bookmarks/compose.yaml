services:
  linkding:
    image: sissbruecker/linkding:latest@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    environment:
      LD_SUPERUSER_NAME: reader
      LD_SUPERUSER_PASSWORD: ${BOOKMARK_PASSWORD:-}
    volumes:
    - bookmarks:/etc/linkding/data
  check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - check
    volumes:
    - ./recipe/check:/check:ro
    entrypoint:
    - python
    - /check/check.py
  sample:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    network_mode: none
    entrypoint:
    - 'true'
  sample-check:
    image: sissbruecker/linkding:latest@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
    profiles:
    - sample
    volumes:
    - ./recipe/check:/check:ro
    - bookmarks:/etc/linkding/data
    entrypoint:
    - python
    - /check/sample.py
    working_dir: /etc/linkding
volumes:
  bookmarks: {}
