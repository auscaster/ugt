# heygen-com/hyperframes: an HTML composition to an MP4, built from upstream's
# own render Dockerfile at the pinned commit. Paths are relative to the
# workspace root; the executor sets UGT_IMAGE and UGT_ARCH.
services:
  task:
    image: ${UGT_IMAGE}
    build:
      context: https://github.com/heygen-com/hyperframes.git#1c3fcf4d237d031107baa6a5646b5bb1ee82cc2a:packages/cli/src/docker
      dockerfile: Dockerfile.render
      args:
        TARGETARCH: ${UGT_ARCH}       # upstream defaults to amd64, which wins even over --platform
        HYPERFRAMES_VERSION: "0.8.214"
    platform: linux/${UGT_ARCH}
    mem_limit: 3g
    shm_size: 1g                      # Chromium
    volumes:
      - ./inputs:/project             # writable: the renderer writes .hyperframes/ beside the composition
      - ./outputs:/out
    command: [--output, /out/video.mp4]

  check:
    image: ${UGT_IMAGE}
    profiles: [check]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs:ro
      - ./recipe/check:/work/check:ro
    entrypoint: [node, check/video.mjs, inputs/index.html, outputs/video.mp4]

  sample:
    image: ${UGT_IMAGE}
    profiles: [sample]
    network_mode: none
    volumes:
      - ./inputs:/work/inputs
      - ./recipe/check:/work/check:ro
    entrypoint: [cp, /work/check/sample.html, /work/inputs/index.html]

  sample-check:
    image: ${UGT_IMAGE}
    profiles: [sample]
    network_mode: none
    working_dir: /work
    volumes:
      - ./outputs:/work/outputs:ro
      - ./recipe/check:/work/check:ro
    entrypoint: [node, check/fade.mjs, outputs/video.mp4]
