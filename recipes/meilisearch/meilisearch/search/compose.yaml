services:
  meilisearch:
    image: getmeili/meilisearch:latest@sha256:b7ba431bf6f9b26cc86132798f3640964147a699cf23f026b74c6c05dbb1d60d
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    volumes:
    - index:/meili_data
  check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - check
    volumes:
    - ./recipe/check:/check:ro
    entrypoint:
    - python
    - /check/check.py
  sample:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    network_mode: none
    entrypoint:
    - 'true'
  sample-check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    volumes:
    - ./recipe/check:/check:ro
    entrypoint:
    - python
    - /check/check.py
    - sample
volumes:
  index: {}
