x-app-image: &app-image ghcr.io/hkuds/deeptutor@sha256:9b8b21ea8861434868ba20adf70966ad9dce193c507c2dcceffbe57264306da8
x-ollama-image: &ollama-image ollama/ollama@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9

services:
  ollama:
    image: *ollama-image
    platform: linux/${UGT_ARCH}
    mem_limit: 3g
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
    volumes: [models:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 3s
      timeout: 3s
      retries: 30
  model:
    image: *ollama-image
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama: {condition: service_healthy}
    entrypoint: [sh, -ec]
    command: ["ollama show qwen2.5:1.5b >/dev/null 2>&1 || ollama pull qwen2.5:1.5b"]
  configure:
    image: *app-image
    volumes:
      - data:/app/data
      - ./recipe:/recipe:ro
    entrypoint: [python, /recipe/configure.py]
    network_mode: none
  deeptutor:
    image: *app-image
    platform: linux/${UGT_ARCH}
    mem_limit: 3g
    volumes:
      - data:/app/data
    depends_on:
      model: {condition: service_completed_successfully}
      configure: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
  check:
    image: *app-image
    profiles: [check]
    volumes: [./recipe:/recipe:ro]
    entrypoint: [python, /recipe/check.py]
  sample:
    image: *app-image
    profiles: [sample]
    network_mode: none
    entrypoint: ["true"]
  sample-check:
    image: *app-image
    profiles: [sample]
    volumes: [./recipe:/recipe:ro]
    entrypoint: [python, /recipe/check.py, sample]

volumes:
  data:
  models:
