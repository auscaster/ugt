services:
  grist:
    image: gristlabs/grist:latest@sha256:da757118d72bad8db073f41bdca50c0f012bc495fc698400cc4db78502964525
    restart: unless-stopped
    expose:
    - 8484
    volumes:
    - grist_data:/persist
    environment:
      GRIST_IN_SERVICE: 'true'
      GRIST_SINGLE_ORG: docs
      GRIST_DEFAULT_EMAIL: owner@localhost.invalid
      GRIST_ADMIN_EMAIL: owner@localhost.invalid
      GRIST_TELEMETRY_LEVEL: 'off'
  check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - check
    volumes:
    - ./recipe/check:/check:ro
    entrypoint:
    - python
    - /check/check.py
  sample:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    network_mode: none
    entrypoint:
    - 'true'
  sample-check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    volumes:
    - ./recipe/check:/check:ro
    entrypoint:
    - python
    - /check/check.py
    - sample
volumes:
  grist_data: null
