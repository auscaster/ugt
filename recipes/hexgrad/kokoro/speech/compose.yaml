services:
  task:
    environment:
      VOICE: ${VOICE:-af_heart}
      SPEED: ${SPEED:-1}
    image: ${UGT_IMAGE}
    build:
      context: ./recipe
    platform: linux/${UGT_ARCH}
    network_mode: none
    working_dir: /work
    mem_limit: 3g
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs
      - ./recipe/check:/work/check:ro
    command: []

  check:
    image: ${UGT_IMAGE}
    platform: linux/${UGT_ARCH}
    profiles: [check]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs:ro
      - ./recipe/check:/work/check:ro
    entrypoint: ["python","check/check.py"]

  sample:
    image: ${UGT_IMAGE}
    platform: linux/${UGT_ARCH}
    profiles: [sample]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs
      - ./recipe/check:/work/check:ro
    entrypoint: ["sh","-ec","echo 'The red boat crossed the river before sunset.' > inputs/text.txt"]

  sample-check:
    image: ghcr.io/auscaster/ugt/recipes:48787048c1a8@sha256:e68fa2e9f8564f44094bf527266e2373ac8865bfddc9ac7f7502864eb8a48d26
    platform: linux/${UGT_ARCH}
    profiles: [sample]
    network_mode: none
    working_dir: /work
    volumes:
      - ./inputs:/work/inputs:ro
      - ./outputs:/work/outputs:ro
      - ./recipe/check:/work/check:ro
    entrypoint: ["python","check/listen.py"]
