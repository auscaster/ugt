services:
  languagetool:
    image: collabora/languagetool:6.6@sha256:a93a2470a49c28e36b0e3b73f4562dab21a532ad10819ddc50bf69f80e98240d
    platform: linux/${UGT_ARCH}
  task:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    depends_on:
    - languagetool
    volumes:
    - ./inputs:/inputs:ro
    - ./outputs:/outputs
    - ./recipe/check:/check:ro
    entrypoint:
    - python
    - /check/convert.py
  check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - check
    network_mode: none
    volumes:
    - ./recipe/check:/check:ro
    - ./inputs:/inputs:ro
    - ./outputs:/outputs:ro
    entrypoint:
    - python
    - /check/check.py
    - check
  sample:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    network_mode: none
    volumes:
    - ./recipe/check:/check:ro
    - ./inputs:/inputs
    entrypoint:
    - python
    - /check/check.py
    - sample
  sample-check:
    image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    profiles:
    - sample
    network_mode: none
    volumes:
    - ./recipe/check:/check:ro
    - ./inputs:/inputs:ro
    - ./outputs:/outputs:ro
    entrypoint:
    - python
    - /check/check.py
    - sample-check
networks:
  default:
    internal: true
