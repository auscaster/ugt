x-base: &base
  image: ${UGT_IMAGE}
  build:
    context: ./recipe
    args: {TARGETARCH: "${UGT_ARCH}"}
  platform: linux/${UGT_ARCH}
  mem_limit: 3g
  network_mode: none
  working_dir: /work
  environment:
    GHIDRA_TIMEOUT: ${GHIDRA_TIMEOUT:-900}
  volumes:
    - ./inputs:/work/inputs:ro
    - ./outputs:/work/outputs
    - ./recipe:/recipe:ro

services:
  task:
    <<: *base
  cli:
    <<: *base
    profiles: [command]
    entrypoint: [/opt/ghidra/support/analyzeHeadless]
  check:
    <<: *base
    profiles: [check]
    entrypoint: [python3, /recipe/analyse.py, check]
  sample:
    <<: *base
    profiles: [sample]
    volumes:
      - ./inputs:/work/inputs
    entrypoint: [cp, /samples/one, /work/inputs/program]
  sample-check:
    <<: *base
    profiles: [sample]
    entrypoint: [python3, /recipe/analyse.py, qualify]
