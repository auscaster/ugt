name: channels

# Publishes a release to the places that install ugt: Homebrew
# (auscaster/homebrew-tap), Scoop (auscaster/scoop-bucket), winget
# (microsoft/winget-pkgs) and the MCP Registry, which lists its MCP bundles.
# internal/devtools/channels writes each manifest from the release's own
# files, and each package manager's is installed from and run before it is
# published, so a manager only ever offers a ugt that installs and runs. The release workflow calls this once a release is out; run it by hand
# for a release already out, as when a manifest needs writing again, with no
# new version. The tap and the bucket are UGT's own and take a release at
# once; winget reviews each version's pull request in its own time. A
# prerelease goes to no package manager.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The release, such as 0.2.1
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - name: A release, not a prerelease
        run: |
          case "$VERSION" in
            *-*) echo "$VERSION is a prerelease, which goes to no package manager"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with: # everything but the recipes: a release never reads one
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: The release's signed list
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern release.json --pattern release.json.sig --pattern SHA256SUMS --dir release
      - name: Its manifests, from its files
        run: go run ./internal/devtools/channels/render -dir release -out channels
      - uses: actions/upload-artifact@v4
        with:
          name: channels
          path: channels/

  homebrew:
    needs: manifests
    strategy:
      matrix:
        runner: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: channels
          path: channels
      - name: Install ugt from the formula, in a tap of its own, and run it
        run: |
          if [ "$RUNNER_OS" = Linux ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git ugt/check
          cp channels/homebrew/ugt.rb "$(brew --repository ugt/check)/Formula/"
          brew trust --formula ugt/check/ugt # as brew install auscaster/tap/ugt trusts it
          brew audit --strict --formula ugt/check/ugt
          brew install ugt/check/ugt
          brew test ugt/check/ugt
          test "$(ugt version | head -1)" = "ugt $VERSION"
          # an AI app UGT connects runs the ugt that outlives an upgrade, never the Cellar's
          home=$(mktemp -d); mkdir -p "$home/.cursor"
          HOME=$home ugt connect cursor
          command=$(jq -r .mcpServers.ugt.command "$home/.cursor/mcp.json")
          case "$command" in */Cellar/*) echo "Cursor runs $command, which an upgrade removes"; exit 1 ;; esac
          test -x "$command"
          if [ "$RUNNER_OS" = macOS ]; then
            codesign --display --entitlements - "$(brew --prefix)/bin/ugt" 2>/dev/null | grep -q com.apple.security.virtualization
          fi

  scoop:
    needs: manifests
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: channels
          path: channels
      - name: Install ugt from the manifest, and run it
        shell: pwsh
        run: |
          iex "& {$(irm https://get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\channels\scoop\ugt.json
          if ($LASTEXITCODE) { throw "scoop install failed" }
          $said = ugt version | Select-Object -First 1
          if ($said -ne "ugt $env:VERSION") { throw "ugt version said: $said" }
          # an AI app UGT connects runs the ugt that outlives an upgrade: Scoop's current
          $home_ = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP connect-home)
          New-Item -ItemType Directory -Force "$home_\.cursor" | Out-Null
          $env:USERPROFILE = $home_
          ugt connect cursor
          $command = (Get-Content "$home_\.cursor\mcp.json" | ConvertFrom-Json).mcpServers.ugt.command
          if ($command -notmatch '\\apps\\ugt\\current\\ugt\.exe$') { throw "Cursor runs $command" }

  winget:
    needs: manifests
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: channels
          path: channels
      - name: Validate the manifests, install ugt from them, and run it
        shell: pwsh
        run: |
          $dir = "channels\winget\manifests\a\auscaster\ugt\$env:VERSION"
          winget validate --manifest $dir
          if ($LASTEXITCODE) { throw "winget validate failed" }
          winget settings --enable LocalManifestFiles
          winget install --manifest $dir --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE) { throw "winget install failed" }
          # winget links the command for shells started after the install
          $said = & "$env:LOCALAPPDATA\Microsoft\WinGet\Links\ugt.exe" version | Select-Object -First 1
          if ($said -ne "ugt $env:VERSION") { throw "ugt version said: $said" }

  publish:
    needs: [homebrew, scoop, winget]
    runs-on: ubuntu-24.04
    concurrency: # one publication at a time, whatever the version, each waiting its turn
      group: channels-publish
      cancel-in-progress: false
      queue: max
    # Holds AUSCASTER_TOKEN, auscaster's one token for GitHub automation (it
    # pushes to the tap and the bucket and opens winget's pull requests), and
    # MCP_REGISTRY_PRIVATE_KEY, the key usegithubthing.com's DNS record proves.
    environment: channels
    steps:
      - name: Every channel publishes, or none does
        env:
          AUSCASTER_TOKEN: ${{ secrets.AUSCASTER_TOKEN }}
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          for secret in AUSCASTER_TOKEN MCP_REGISTRY_PRIVATE_KEY; do
            test -n "${!secret}" || { echo "The channels environment has no $secret"; exit 1; }
          done
      - uses: actions/download-artifact@v4
        with:
          name: channels
          path: channels
      - uses: actions/checkout@v4
        with:
          repository: auscaster/homebrew-tap
          token: ${{ secrets.AUSCASTER_TOKEN }}
          path: tap
      - uses: actions/checkout@v4
        with:
          repository: auscaster/scoop-bucket
          token: ${{ secrets.AUSCASTER_TOKEN }}
          path: bucket
      - name: The formula to the tap, and the manifest to the bucket
        run: |
          publish() { # repository folder, file in it, manifest, the version that file holds now
            if [ -n "$4" ] && [ "$(printf '%s\n' "$4" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
              echo "$1 holds ugt $4, newer than $VERSION: left as it is"
              return
            fi
            cp "$3" "$1/$2"
            git -C "$1" add "$2"
            git -C "$1" diff --cached --quiet && return
            git -C "$1" config user.name "github-actions[bot]"
            git -C "$1" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$1" commit -q -m "ugt $VERSION"
            git -C "$1" pull -q --rebase # another tool's release may have pushed since
            git -C "$1" push -q
          }
          publish tap Formula/ugt.rb channels/homebrew/ugt.rb \
            "$(sed -n 's#.*/releases/download/v\([^/]*\)/.*#\1#p' tap/Formula/ugt.rb 2>/dev/null | head -1)"
          publish bucket bucket/ugt.json channels/scoop/ugt.json \
            "$(jq -r .version bucket/bucket/ugt.json 2>/dev/null)"
      - name: The manifests to winget, as a pull request
        env:
          AUSCASTER_TOKEN: ${{ secrets.AUSCASTER_TOKEN }}
        run: |
          curl -fsSL -o komac.deb https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac_2.17.1-1_amd64.deb
          echo "6a44816c5414263ab4d517668d8a8ff1b2cbbc656a3a2b1e4be8ecba5a37c441  komac.deb" | sha256sum -c -
          sudo dpkg -i komac.deb
          komac submit --token "$AUSCASTER_TOKEN" --yes "channels/winget/manifests/a/auscaster/ugt/$VERSION"
      - name: The MCP bundles to the MCP Registry, once each version
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          if curl -fsS -o /dev/null "https://registry.modelcontextprotocol.io/v0/servers/com.usegithubthing%2Fugt/versions/$VERSION"; then
            echo "The MCP Registry lists ugt $VERSION already"
            exit 0
          fi
          curl -fsSL -o publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz" | sha256sum -c -
          tar -xzf publisher.tar.gz mcp-publisher
          cd channels/registry
          ../../mcp-publisher login dns --domain usegithubthing.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"
          ../../mcp-publisher publish
