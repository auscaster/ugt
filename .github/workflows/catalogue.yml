name: catalogue

# Admission: verifies every recipe a pull request adds or changes, on clean
# machines and with no secrets, using ugt built from the base branch, so a
# pull request cannot change the executor that judges it. It runs only when
# a pull request touches recipes/, or by hand for one recipe.

on:
  pull_request:
    paths: ["recipes/**"]
  workflow_dispatch:
    inputs:
      recipe:
        description: The recipe to verify, as owner/repo/task
        required: true

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-24.04
    outputs:
      recipes: ${{ steps.changed.outputs.recipes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Find the recipes it changes
        id: changed
        env:
          DISPATCHED: ${{ inputs.recipe }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            ids="$DISPATCHED"
          else
            ids=$(git diff --name-only "$BASE"...HEAD -- recipes/ | awk -F/ 'NF >= 5 { print $2 "/" $3 "/" $4 }' | sort -u)
          fi
          # a removed recipe has nothing to verify
          kept=$(printf '%s\n' "$ids" | while read -r id; do
            if [ -n "$id" ] && [ -f "recipes/$id/recipe.json" ]; then echo "$id"; fi
          done)
          echo "recipes=$(printf '%s\n' "$kept" | jq -R . | jq -cs 'map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "Recipes: ${kept:-none}"

      - name: Every recipe is valid, filed under its ID and carries its evidence
        run: go test ./recipes/ ./internal/domain/recipe/

  verify:
    needs: admit
    if: needs.admit.outputs.recipes != '[]'
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.admit.outputs.recipes) }}
        # GitHub's Arm runners serve public repositories
        runner: ${{ github.event.repository.private && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: The executor, from the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: base
      - name: The recipe, from the pull request
        uses: actions/checkout@v4
        with:
          path: proposed
      - uses: actions/setup-go@v5
        with:
          go-version-file: base/go.mod
          cache-dependency-path: base/go.sum
      - name: Build ugt
        working-directory: base
        run: go build -o "$RUNNER_TEMP/ugt" ./cmd/ugt
      - name: Verify ${{ matrix.recipe }}
        run: |
          set -o pipefail
          "$RUNNER_TEMP/ugt" recipe verify --json "proposed/recipes/${{ matrix.recipe }}" > "$RUNNER_TEMP/report.json" || status=$?
          jq '{recipe, revision, arch, passed, seconds, steps: [.steps[] | {name, exit, seconds, findings}], weak: [.check_strength[]? | select(.rejected | not)]}' "$RUNNER_TEMP/report.json"
          exit "${status:-0}"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: ignore
