name: desktop first use
# Explicit opt-in. Routine code and recipe pushes do not start this journey.
on:
  workflow_dispatch:
  push:
    branches: [test/desktop-qualification, test/first-use-platforms, test/windows-first-use]
permissions:
  contents: read
concurrency:
  group: desktop-first-use-${{ github.repository }}
  cancel-in-progress: true
jobs:
  desktop:
    if: github.repository == 'usegeekthing/ugt' && github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.ref_name == 'test/windows-first-use' && '["windows-2025"]' || '["ubuntu-24.04","windows-2025"]') }}
    timeout-minutes: 20
    env:
      UGT_RUNTIME: ${{ matrix.os == 'ubuntu-24.04' && 'host' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Prepare real client CLIs and fresh settings
        run: |
          npm install --global --no-audit --no-fund @openai/codex@0.167.1 @anthropic-ai/claude-code@2.1.322 @google/gemini-cli@0.68.0
          python .github/ci/agents.py prepare
      - name: Prepare the browser on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install desktop-file-utils xdg-utils xvfb xauth libglib2.0-bin
      - name: Build the candidate and prepare checks
        run: |
          set -euo pipefail
          pip -q install playwright==1.56.0 python-docx==1.2.0
          python -m playwright install --with-deps chromium
          dest="$RUNNER_TEMP/release/latest/download"
          mkdir -p "$dest"
          name=ugt-linux-amd64; opener=capture-open
          if [[ "$RUNNER_OS" == Windows ]]; then name=ugt-windows-amd64.exe; opener=capture-open.exe; fi
          go build -trimpath -o "$dest/$name" ./cmd/ugt
          go build -o "$RUNNER_TEMP/$opener" .github/ci/capture-open.go
          # Match the release writer's digest format on both operating systems.
          python - "$dest" "$name" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1]); name=sys.argv[2]
          (root/'SHA256SUMS').write_text(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n')
          PY
          echo "BROWSER=$RUNNER_TEMP/$opener" >> "$GITHUB_ENV"
          echo "UGT_CAPTURE=$RUNNER_TEMP/open-target" >> "$GITHUB_ENV"
          if [[ "$RUNNER_OS" == Linux ]]; then echo "UGT_CI_EXE=$HOME/.local/bin/ugt" >> "$GITHUB_ENV"; fi
      - name: Install through the shipped Linux installer
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          python -m http.server 8872 --bind 127.0.0.1 --directory "$RUNNER_TEMP/release" > "$RUNNER_TEMP/release.log" 2>&1 &
          for _ in {1..30}; do curl -fsS http://127.0.0.1:8872/latest/download/SHA256SUMS && break; sleep .2; done
          UGT_RELEASES=http://127.0.0.1:8872 sh install/install.sh
      - name: Install through the shipped Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList @('-m','http.server','8872','--bind','127.0.0.1','--directory',"$env:RUNNER_TEMP/release") -PassThru
          New-Item -ItemType Directory -Force evidence | Out-Null
          try {
            for ($n=0; $n -lt 30; $n++) {
              try { Invoke-WebRequest http://127.0.0.1:8872/latest/download/SHA256SUMS | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
            }
            $env:UGT_RELEASES = 'http://127.0.0.1:8872'
            & ./install/install.ps1 *>&1 | Tee-Object evidence/install.log
            $exe = "$env:LOCALAPPDATA\UGT\bin\ugt.exe"
            $status = & $exe doctor --json | ConvertFrom-Json
            if ($status.runtime -ne 'wsl' -or -not ($status.checks | Where-Object { $_.name -eq 'engine' }).ok) { throw 'The installed WSL engine is not ready' }
            "UGT_CI_EXE=$exe" >> $env:GITHUB_ENV
          } finally { Stop-Process -Id $server.Id }
      - name: Convert a document, recover from a mistake, and reopen a saved service
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            dbus-run-session -- xvfb-run -a python .github/ci/desktop.py
          else
            python .github/ci/desktop.py
          fi
      - name: Confirm client configuration, local tool readiness and a delivered result after reconnect
        run: python .github/ci/agents.py
      - name: Author and run an uncovered task through MCP
        if: runner.os == 'Linux'
        run: python .github/ci/authoring.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-result-${{ runner.os }}
          path: |
            evidence/journey.json
            evidence/authoring.json
            evidence/booking.docx
            evidence/mcp.log
            evidence/install.log
            evidence/agents.json
            evidence/agent-mcp.log
          retention-days: 3
