name: windows

# Proves ugt on Windows, run by hand only: unit tests on real Windows, then
# ugt setup creating UGT's WSL distro and engine, and fixture recipes verified
# and run through it, by the command line and through the MCP server: a job,
# a service's page opened from Windows, a command used on a Windows folder,
# and a recipe's MCP server called among UGT's tools from Windows PowerShell. With
# "full" it also builds and verifies two catalogue recipes inside WSL: about
# 30 minutes instead of about 10. Recipes that declare access are agreed to
# with --allow, as the runner has no one to ask.

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also build and verify text-to-cad, and Firecrawl's five services
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: "1" # Git Bash must not rewrite the /paths in ugt's arguments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests, and a Credential Manager round trip
        env:
          UGT_KEYCHAIN_TEST: "1"
        run: go test -short ./...

      - name: Build ugt
        run: go build -o ugt.exe ./cmd/ugt

      - name: Give WSL 6 GB, as on a 16 GB PC
        if: inputs.full # Firecrawl reserves 4.3 GB; WSL takes half the runner's 7.6 GB by default
        run: printf '[wsl2]\nmemory=6GB\n' > "$(cygpath -u "$USERPROFILE")/.wslconfig"

      - name: ugt setup
        run: ./ugt.exe setup --yes

      - name: ugt doctor
        env:
          GITHUB_TOKEN: ${{ github.token }} # a shared runner's address runs out of anonymous requests
        run: ./ugt.exe doctor

      - name: Verify and run a job whose image runs as an unprivileged user
        run: |
          ./ugt.exe recipe verify .github/ci/non-root
          recipes="$(cygpath -u "$LOCALAPPDATA")/UGT/recipes/mirror/busybox"
          home="$(cygpath -u "$USERPROFILE")/UGT"
          mkdir -p "$recipes" "$home"
          cp -R .github/ci/non-root "$recipes/greeting"
          echo CI > "$home/name.txt"
          ./ugt.exe run --input name.txt mirror/busybox greeting
          grep -qx 'Hello, CI' "$home/mirror/busybox/greeting/greeting.txt"

      - name: Verify a service, look inside it, and resume
        run: |
          ./ugt.exe recipe verify --allow .github/ci/static-site
          ./ugt.exe recipe exec .github/ci/static-site sample-check -- sh -c 'wget -q -O - http://app:8080/index.html' | grep -q 'Hello from UGT'
          ./ugt.exe recipe verify --from check .github/ci/static-site

      - name: Open a service's page from Windows, at the address UGT keeps
        run: |
          recipes="$(cygpath -u "$LOCALAPPDATA")/UGT/recipes/mirror/busybox"
          home="$(cygpath -u "$USERPROFILE")/UGT"
          cp -R .github/ci/static-site "$recipes/static-site"
          echo '<h1>Hello from UGT</h1>' > "$home/index.html"
          first=$(./ugt.exe run --allow --json --input index.html mirror/busybox static-site | jq -r '.pages[0].url')
          curl -fsS "$first" | grep -q 'Hello from UGT'
          again=$(./ugt.exe run --allow --json --input index.html mirror/busybox static-site | jq -r '.pages[0].url')
          [ "$first" = "$again" ] || { echo "the page moved from $first to $again"; exit 1; }
          ./ugt.exe stop mirror/busybox/static-site

      - name: Put a command on the PATH, for the next step
        run: |
          ./ugt.exe recipe verify .github/ci/command
          cp -R .github/ci/command "$(cygpath -u "$LOCALAPPDATA")/UGT/recipes/mirror/busybox/words"
          ./ugt.exe run mirror/busybox words

      - name: Use the command on a Windows folder, through its launcher
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          'one two three four' | Set-Content words.txt
          $out = & "$env:LOCALAPPDATA\UGT\bin\ugt-ci-words.cmd" words.txt
          if ($LASTEXITCODE -ne 0 -or "$out" -notmatch '^\s*4\b') { throw "ugt-ci-words said: $out" }
          & "$env:GITHUB_WORKSPACE\ugt.exe" remove mirror/busybox/words
          if (Test-Path "$env:LOCALAPPDATA\UGT\bin\ugt-ci-words.cmd") { throw "remove left the launcher" }

      - name: Run a recipe through the MCP server
        run: go test ./cmd/ugt -run TestMCPEndToEnd -v

      - name: Call a recipe's MCP server among UGT's tools, from Windows PowerShell
        # Windows PowerShell on a UTF-8 console, as on many PCs, puts a
        # byte-order mark before a program's input: ugt mcp serves it anyway.
        shell: powershell
        run: |
          [Console]::InputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\UGT\recipes\modelcontextprotocol\servers" | Out-Null
          Copy-Item -Recurse .github\ci\mcp-time "$env:LOCALAPPDATA\UGT\recipes\modelcontextprotocol\servers\time"
          .\ugt.exe run modelcontextprotocol/servers
          if ($LASTEXITCODE -ne 0) { throw 'ugt run failed' }
          $p = New-Object System.Diagnostics.Process
          $p.StartInfo.FileName = "$env:GITHUB_WORKSPACE\ugt.exe"
          $p.StartInfo.Arguments = 'mcp'
          $p.StartInfo.UseShellExecute = $false
          $p.StartInfo.RedirectStandardInput = $true
          $p.StartInfo.RedirectStandardOutput = $true
          [void]$p.Start()
          function Send($m) { $p.StandardInput.WriteLine((ConvertTo-Json $m -Depth 10 -Compress)) }
          function Receive { $line = $p.StandardOutput.ReadLine(); if ($null -eq $line) { throw 'ugt mcp ended' }; $line | ConvertFrom-Json }
          function Reply($id) { do { $m = Receive } until ($m.id -eq $id); $m }
          Send @{ jsonrpc = '2.0'; id = 1; method = 'initialize'; params = @{ protocolVersion = '2025-11-25'; capabilities = @{}; clientInfo = @{ name = 'powershell'; version = '5.1' } } }
          [void](Reply 1)
          Send @{ jsonrpc = '2.0'; method = 'notifications/initialized' }
          # the recipe's tools join UGT's once its server has started
          $id = 2
          while ($true) {
            Send @{ jsonrpc = '2.0'; id = $id; method = 'tools/list' }
            $tool = (Reply $id).result.tools | Where-Object { $_.name -like '*get_current_time' } | Select-Object -First 1
            $id++
            if ($tool) { break }
            do { $m = Receive } until ($m.method -eq 'notifications/tools/list_changed')
          }
          Send @{ jsonrpc = '2.0'; id = $id; method = 'tools/call'; params = @{ name = $tool.name; arguments = @{ timezone = 'Australia/Sydney' } } }
          $time = (Reply $id).result.content[0].text | ConvertFrom-Json
          if ($time.timezone -ne 'Australia/Sydney') { throw "$($tool.name) said $($time | ConvertTo-Json -Compress)" }
          $p.StandardInput.Close(); $p.WaitForExit()
          .\ugt.exe remove modelcontextprotocol/servers/time

      - name: Build and verify text-to-cad
        if: inputs.full
        run: ./ugt.exe recipe verify recipes/earthtojake/text-to-cad/stl

      - name: Verify Firecrawl's five-service stack
        if: inputs.full
        run: ./ugt.exe recipe verify --allow recipes/firecrawl/firecrawl/markdown

      - name: The engine's log
        if: failure()
        run: wsl.exe -d UGT -u root --exec tail -n 200 /var/log/dockerd.log || true

      - name: What ugt holds
        if: always()
        run: ./ugt.exe list || true
