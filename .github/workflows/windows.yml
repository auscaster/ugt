name: windows

# Proves ugt on Windows, run by hand only: unit tests on real Windows, then
# ugt setup creating UGT's WSL distro and engine, and fixture recipes verified
# and run through it, by the command line and through the MCP server. With
# "full" it also builds and verifies two catalogue recipes inside WSL: about
# 30 minutes instead of about 10. Recipes that declare access are agreed to
# with --allow, as the runner has no one to ask.

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also build and verify text-to-cad, and Firecrawl's five services
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MSYS_NO_PATHCONV: "1" # Git Bash must not rewrite the /paths in ugt's arguments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit tests, and a Credential Manager round trip
        env:
          UGT_KEYCHAIN_TEST: "1"
        run: go test -short ./...

      - name: Build ugt
        run: go build -o ugt.exe ./cmd/ugt

      - name: Give WSL 6 GB, as on a 16 GB PC
        if: inputs.full # Firecrawl reserves 4.3 GB; WSL takes half the runner's 7.6 GB by default
        run: printf '[wsl2]\nmemory=6GB\n' > "$(cygpath -u "$USERPROFILE")/.wslconfig"

      - name: ugt setup
        run: ./ugt.exe setup --yes

      - name: ugt doctor
        run: ./ugt.exe doctor

      - name: Verify and run a job whose image runs as an unprivileged user
        run: |
          ./ugt.exe recipe verify .github/ci/non-root
          recipes="$(cygpath -u "$LOCALAPPDATA")/UGT/recipes/mirror/busybox"
          home="$(cygpath -u "$USERPROFILE")/UGT"
          mkdir -p "$recipes" "$home"
          cp -R .github/ci/non-root "$recipes/greeting"
          echo CI > "$home/name.txt"
          ./ugt.exe run --input name.txt mirror/busybox greeting
          grep -qx 'Hello, CI' "$home/mirror/busybox/greeting/greeting.txt"

      - name: Verify a service, look inside it, and resume
        run: |
          ./ugt.exe recipe verify --allow .github/ci/static-site
          ./ugt.exe recipe exec .github/ci/static-site sample-check -- sh -c 'wget -q -O - http://app:8080/index.html' | grep -q 'Hello from UGT'
          ./ugt.exe recipe verify --from check .github/ci/static-site

      - name: Run a recipe through the MCP server
        run: go test ./cmd/ugt -run TestMCPEndToEnd -v

      - name: Build and verify text-to-cad
        if: inputs.full
        run: ./ugt.exe recipe verify recipes/earthtojake/text-to-cad/stl

      - name: Verify Firecrawl's five-service stack
        if: inputs.full
        run: ./ugt.exe recipe verify --allow recipes/firecrawl/firecrawl/markdown

      - name: The engine's log
        if: failure()
        run: wsl.exe -d UGT -u root --exec tail -n 200 /var/log/dockerd.log || true

      - name: What ugt holds
        if: always()
        run: ./ugt.exe list || true
