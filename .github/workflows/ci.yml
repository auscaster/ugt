name: ci

# The product's checks. A change only to recipes/ is the catalogue's, which
# the catalogue service admits: recipe merges never run these.
on:
  push:
    branches: [main, test/first-use-checks]
    paths-ignore: ["recipes/**", ".github/ci/catalogue-smoke.py", ".github/workflows/catalogue-smoke.yml"]
  pull_request:
    paths-ignore: ["recipes/**", ".github/ci/catalogue-smoke.py", ".github/workflows/catalogue-smoke.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UGT_RUNTIME: host
    steps:
      - uses: actions/checkout@v4
        with: # everything but the recipes: product checks never read one
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  macos:
    # UGT's Mac machine needs cgo, so its code builds only on macOS; the
    # runner has no engine, so the tests that need one are skipped
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...
      - name: Check named credentials on the disposable Mac
        env:
          UGT_KEYCHAIN_TEST: "1"
        run: go test -count=1 -v ./cmd/ugt -run '^TestNamedServiceCredentials$'
      - name: Intel Macs build without cgo
        run: CGO_ENABLED=0 GOARCH=amd64 go build -o /dev/null ./cmd/ugt

  windows:
    # the unit tests on Windows file systems and paths; windows.yml, run by
    # hand, proves UGT's WSL distro and engine
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...
