name: ci

# The product's checks. A change only to recipes/ is the catalogue's, which
# the catalogue service admits: recipe merges never run these.
on:
  push:
    branches: [main]
    paths-ignore: ["recipes/**"]
  pull_request:
    paths-ignore: ["recipes/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: # everything but the recipes: product checks never read one
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
