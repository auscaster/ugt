name: layer

# Builds UGT's Linux layer for amd64 and arm64, the files UGT's machine boots
# (arm64 on a Mac, amd64 on Linux) and the QEMU that runs it on Linux, and on
# main publishes them as ghcr.io/auscaster/ugt/layer:<revision>,
# <revision>-machine and <revision>-qemu, the revision ugt derives from the
# files in layer/. A revision is built and published once:
# one already published is never built again, so it stays exactly what ugt and
# the catalogue's verification run.
on:
  push:
    branches: [main]
    paths: ["layer/**"]
  pull_request:
    paths: ["layer/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: # the layer and the helper that names it, never the recipes
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Name the revision
        run: echo "image=$(go run ./cmd/ugt version --json | jq -r .layer)" >> "$GITHUB_ENV"

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build, and publish on main
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          output=type=cacheonly
          [ "$PUSH" = true ] && output=type=registry
          # each is published once, so a revision's layer, machine and QEMU never change
          build() {
            if [ "$PUSH" = true ] && docker buildx imagetools inspect "$1" > /dev/null 2>&1; then
              echo "$1 is published already; it is never built again"
              return
            fi
            docker buildx build --target "$2" --platform "$3" --build-arg "REVISION=${image##*:}" \
              --output "$output" --tag "$1" layer/
          }
          build "$image" layer linux/amd64,linux/arm64
          build "$image-machine" machine linux/amd64,linux/arm64
          build "$image-qemu" qemu linux/amd64
