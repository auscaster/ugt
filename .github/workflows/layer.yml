name: layer

# Builds UGT's Linux layer for amd64 and arm64, the files UGT's machine boots
# (on a Mac and on Linux) and the QEMU that runs it on Linux, and on main
# publishes them as ghcr.io/auscaster/ugt/layer:<revision>, <revision>-machine
# and <revision>-qemu, the revision ugt derives from the files in layer/.
# QEMU compiles on a runner of each computer it is for, never emulated, and
# one image list names both. A revision is built and published once: one
# already published is never built again, so it stays exactly what ugt and the
# catalogue's verification run.
on:
  push:
    branches: [main]
    paths: ["layer/**"]
  pull_request:
    paths: ["layer/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer:
    runs-on: ubuntu-24.04
    # The layer's package belongs to auscaster, whose installed helpers pull it by that name, and a
    # personal account's package grants no access to an organization's repositories: publishing
    # signs in with auscaster's token, which the packages environment holds for main.
    environment: ${{ github.event_name != 'pull_request' && 'packages' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: # the layer and the helper that names it, never the recipes
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Name the revision
        run: echo "image=$(go run ./cmd/ugt version --json | jq -r .layer)" >> "$GITHUB_ENV"

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.AUSCASTER_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username auscaster --password-stdin

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build, and publish on main
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          output=type=cacheonly
          [ "$PUSH" = true ] && output=type=registry
          # each is published once, so a revision's layer, machine and QEMU never change
          build() {
            if [ "$PUSH" = true ] && docker buildx imagetools inspect "$1" > /dev/null 2>&1; then
              echo "$1 is published already; it is never built again"
              return
            fi
            docker buildx build --target "$2" --platform "$3" --build-arg "REVISION=${image##*:}" \
              --output "$output" --tag "$1" layer/
          }
          build "$image" layer linux/amd64,linux/arm64
          build "$image-machine" machine linux/amd64,linux/arm64

  qemu:
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.event_name != 'pull_request' && 'packages' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Name the revision
        run: echo "image=$(go run ./cmd/ugt version --json | jq -r .layer)" >> "$GITHUB_ENV"
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.AUSCASTER_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username auscaster --password-stdin
      - uses: docker/setup-buildx-action@v3
      - name: Build QEMU for this computer, and on main publish it by its digest
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p digests
          if [ "$PUSH" = true ] && docker buildx imagetools inspect "$image-qemu" > /dev/null 2>&1; then
            echo "$image-qemu is published already; it is never built again"
            exit 0
          fi
          output=type=cacheonly
          [ "$PUSH" = true ] && output="type=image,name=${image%:*},push-by-digest=true,name-canonical=true,push=true"
          docker buildx build --target qemu --platform "${{ matrix.platform }}" --build-arg "REVISION=${image##*:}" \
            --output "$output" --metadata-file metadata.json layer/
          if [ "$PUSH" = true ]; then jq -r '."containerimage.digest"' metadata.json > "digests/${{ matrix.arch }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.arch }}
          path: digests/
          if-no-files-found: ignore

  qemu-list:
    needs: [layer, qemu] # the list goes up only once the machine's files are out
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: qemu-*
          path: digests
          merge-multiple: true
      - name: Publish one list naming both computers' QEMU
        env:
          TOKEN: ${{ secrets.AUSCASTER_TOKEN }}
        run: |
          set -euo pipefail
          image=$(go run ./cmd/ugt version --json | jq -r .layer)
          if [ ! -s digests/amd64 ] || [ ! -s digests/arm64 ]; then
            echo "$image-qemu was published already, or a build made nothing to list"
            docker buildx imagetools inspect "$image-qemu"
            exit 0
          fi
          echo "$TOKEN" | docker login ghcr.io --username auscaster --password-stdin
          docker buildx imagetools create --tag "$image-qemu" "${image%:*}@$(cat digests/amd64)" "${image%:*}@$(cat digests/arm64)"
          docker buildx imagetools inspect "$image-qemu"
