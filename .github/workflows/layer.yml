name: layer

# Builds UGT's Linux layer for amd64 and arm64, and on main publishes it as
# ghcr.io/auscaster/ugt/layer:<revision>, the revision ugt derives from the
# files in layer/. A revision is built and published once: one already
# published is never built again, so it stays exactly what ugt and the
# catalogue's verification run.
on:
  push:
    branches: [main]
    paths: ["layer/**"]
  pull_request:
    paths: ["layer/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: # the layer and the helper that names it, never the recipes
          sparse-checkout: |
            /*
            !/recipes/*/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Name the revision
        run: echo "image=$(go run ./cmd/ugt version --json | jq -r .layer)" >> "$GITHUB_ENV"

      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Skip a revision already published
        id: published
        if: github.event_name != 'pull_request'
        run: |
          if docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "$image is published already; it is never built again"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.published.outputs.done != 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.done != 'true'

      - name: Build, and publish on main
        if: steps.published.outputs.done != 'true'
        env:
          PUSH: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          output=type=cacheonly
          [ "$PUSH" = true ] && output=type=registry
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg "REVISION=${image##*:}" \
            --output "$output" --tag "$image" layer/
